name: CD with Gradle

# pull request가 close 되었을 때 실행
on:
  pull_request:
    types: [ closed ]

# github action이 읽을 수 있도록 수정
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      # jdk 17 버전 환경을 세팅
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: "adopt"

      # 깃에 없는 application.yml 파일 생성
      - name: Make application.yml
        run: |
          cd ./src/main/resources
          echo "${{ secrets.YML }}" > ./application.yml
        shell: bash

      # 소스 빌드
      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test

      # dockerfile을 통해 이미지를 빌드하고, 이를 docker repo로 push
      - name: Docker build & push to docker repo
        run: |
          echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
          docker build -f Dockerfile -t ${{ secrets.DOCKER_REPO }}/feetfit .
          docker push ${{ secrets.DOCKER_REPO }}/feetfit

        # 서버에 접속하여 pull 한 후 docker compose로 컨테이너 재생성
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        id: deploy
        with:
          host: ${{ secrets.HOST }}
          username: ubuntu
          key: ${{ secrets.KEY }}
          envs: GITHUB_SHA
          script: |
            set -e

            if ! sudo docker compose version >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y docker-compose-plugin || true
            fi

            if sudo docker compose version >/dev/null 2>&1; then
              compose() { sudo docker compose "$@"; }
            elif command -v docker-compose >/dev/null 2>&1; then
              compose() { sudo docker-compose "$@"; }
            else
              echo "docker compose 또는 docker-compose가 설치되어 있어야 합니다."
              exit 1
            fi

            sudo docker rm -f $(sudo docker ps -qa) || true
            compose down || true
            sudo docker pull ${{ secrets.DOCKER_REPO }}/feetfit
            compose up -d
            sudo docker image prune -f
