spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: SET time_zone = '+09:00'

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
    show-sql: true

  flyway:
    enabled: false
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jackson:
    time-zone: Asia/Seoul

jwt:
  secret: ${JWT_SECRET}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

swagger:
  local-server-url: ${SWAGGER_LOCAL_SERVER_URL:http://localhost:8080}
  deploy-server-url: ${SWAGGER_DEPLOY_SERVER_URL:http://34.209.169.111}

file:
  upload:
    storage-mode: ${FILE_UPLOAD_STORAGE_MODE:AUTO}
    proxy-upload-url: ${FILE_UPLOAD_PROXY_UPLOAD_URL:}
    bucket-name: ${S3_BUCKET_NAME:project5-42-oregon-feetfit-s3}
    region: ${AWS_REGION:us-west-2}

    public-url-prefix: ${S3_PUBLIC_URL_PREFIX:https://project5-42-oregon-feetfit-s3.s3.us-west-2.amazonaws.com}
    aws-cli-path: ${AWS_CLI_PATH:}

hardware:
  measurement:
    start-url: ${HARDWARE_MEASUREMENT_START_URL:https://98a3-2001-e60-217e-e32c-da3a-ddff-fee8-b506.ngrok-free.app/measurement/start}
    photo-capture-url: ${HARDWARE_PHOTO_CAPTURE_URL:https://98a3-2001-e60-217e-e32c-da3a-ddff-fee8-b506.ngrok-free.app/measurement/photo/start}
    pressure-environment-measurement-url: ${HARDWARE_PRESSURE_ENVIRONMENT_MEASUREMENT_URL:https://98a3-2001-e60-217e-e32c-da3a-ddff-fee8-b506.ngrok-free.app/measurement/sensor/start}

internal:
  api-key: ${INTERNAL_API_KEY:feetfit-local-secret-2026}
